[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "rct"
version = "0.1.0"
description = "Raleigh Commute Digital Twin — Uber vs. My AI"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff (lint + format) ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # RUF002: docstring contains ambiguous unicode (en-dash, Greek letters).
    # These are intentional in range notation (FR-1 -- FR-2) and symbol names (rho).
    "RUF002",
    # UP017: use datetime.UTC alias introduced in Python 3.11.
    # Local dev may run 3.10; keep datetime.timezone.utc for portability.
    "UP017",
    # N806/N803: uppercase variable/argument names — standard Kalman filter matrix
    # notation (F, P, G, Q, R, K, H, S, Ps, Pp, Fs).  Renaming would harm readability.
    "N806",
    "N803",
]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print (no print())
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]  # allow print in tests

# ── Mypy (strict type checking) ───────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
pythonpath = ["src"]
markers = [
    "integration: requires Docker services (Valhalla, ROS 2)",
    "slow: runs > 10 s",
]
