# FR-7.3 -- Local dev topology: Python worker + ROS 2 worker + Valhalla map-matcher.
# All three services share the rct-net bridge network.
# MinIO (S3-parity) is commented out -- optional in Phase 1 per TRD sec.5.

services:
  python:
    image: rct-python:dev
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    volumes:
      - .:/workspace
      - ./data:/data:ro
      - ./out:/out
    networks:
      - rct-net

  ros2:
    image: rct-ros2:dev
    build:
      context: .
      dockerfile: docker/ros2.Dockerfile
    volumes:
      - .:/workspace
      - ./data:/data:ro
      - ./out:/out
    networks:
      - rct-net

  valhalla:
    # Valhalla 3.5.x self-hosted map-matcher (TRD sec.5).
    # NC tiles are downloaded or pre-generated on first run per T4.1.
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
    volumes:
      - ./docker/valhalla:/custom_files
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - rct-net

