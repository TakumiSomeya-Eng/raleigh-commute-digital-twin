# FR-5.2 -- UKF node parameters.
# ROS 2 params format: /**  matches any node name.
# Noise parameters intentionally match ekf.yaml for fair comparison.
# Implemented in task T2.7.

/**:
  ros__parameters:
    sigma_points:
      # Julier-Uhlmann scaling parameters.
      alpha: 0.001
      beta: 2.0
      kappa: 0.0

    process_noise:
      sigma_a_mps2: 1.0
      sigma_psi_dot_rps: 0.1

    measurement_noise:
      bearing_min_speed_mps: 2.0
      mag_only_fallback_speed_mps: 1.0
      sigma_bearing_rad: 0.35

    outlier_gate:
      chi2_confidence: 0.99

    initialization:
      method: first_gps
      wait_gps_count: 3
